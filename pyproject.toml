[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "werkmate"
version = "0.2.0"
description = "Persoenlicher Auftrags-, Schicht- und Vorgabezeiten-Assistent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "WerkMate" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
werkmate = "werkmate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
